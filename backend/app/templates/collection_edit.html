{% extends "base.html" %}
{% block title %}编辑收藏 - {{ anime.name_cn or anime.name_jp }}{% endblock %}
{% block content %}
<section class="form-panel">
  <h1>编辑收藏：{{ anime.name_cn or anime.name_jp }}</h1>
  <form method="post" class="collection-form">
    <label><input type="checkbox" name="collected" {% if anime.collected %}checked{% endif %}> 是否收藏</label>
    <label>媒介类型 <input name="media_type" value="{{ anime.media_type or '' }}" autofocus></label>
    <label>字幕组 <input name="subtitle_group" value="{{ anime.subtitle_group or '' }}"></label>
    <label>来源网站 <input name="source_site" value="{{ anime.source_site or '' }}"></label>
    <label>收藏日期 <input type="date" name="collection_date" value="{{ anime.collection_date or '' }}"></label>
    <label>我的评分 <input type="number" step="0.1" min="0" max="10" name="my_rating" value="{{ anime.my_rating if anime.my_rating is not none else '' }}"></label>
    <label>备注 <textarea name="notes">{{ anime.notes or '' }}</textarea></label>
    <label>观看进度 <input name="progress" value="{{ anime.progress or '' }}"></label>
    <label>其他 <textarea name="extra">{{ anime.extra_json or '' }}</textarea></label>
    <div class="actions"><button type="submit">保存并关闭</button><a class="button-link" href="/anime/{{ anime.id }}">取消</a></div>
  </form>
</section>
<script>
document.querySelector('.collection-form').addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && event.target.tagName !== 'TEXTAREA') {
    event.preventDefault();
    event.currentTarget.requestSubmit();
  }
});
</script>
{% endblock %}
