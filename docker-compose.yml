services:
  web:
    build: .
    container_name: chronoshelter-web
    env_file: .env
    ports:
      - "8700:8700"
    volumes:
      - ./media/covers:/app/media/covers
      - ./data/archive:/app/data/archive
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
